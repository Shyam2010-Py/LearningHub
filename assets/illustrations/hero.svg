<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Student learning illustration">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.15"/>
        </linearGradient>
        <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00D4FF"/>
            <stop offset="100%" stop-color="#4F46E5"/>
        </linearGradient>
        <linearGradient id="grn" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00E676"/>
            <stop offset="100%" stop-color="#00D4FF"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="200" cy="200" r="170" fill="url(#bg)" stroke="rgba(0,212,255,0.25)" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="200" cy="200" r="135" fill="none" stroke="rgba(0,212,255,0.15)" stroke-width="1" stroke-dasharray="2 4"/>

    <!-- Glow -->
    <circle cx="200" cy="200" r="120" fill="url(#glow)"/>

    <!-- Floating book/laptop -->
    <g transform="translate(110 130)">
        <!-- Laptop base -->
        <rect x="0" y="100" width="180" height="14" rx="4" fill="#1B2440" stroke="rgba(0,212,255,0.4)" stroke-width="1.5"/>
        <!-- Screen -->
        <rect x="10" y="10" width="160" height="95" rx="6" fill="#0B1020" stroke="url(#acc)" stroke-width="2"/>
        <!-- Screen content -->
        <rect x="20" y="22" width="60" height="6" rx="3" fill="url(#acc)"/>
        <rect x="20" y="34" width="90" height="3" rx="1.5" fill="rgba(0,212,255,0.4)"/>
        <rect x="20" y="42" width="70" height="3" rx="1.5" fill="rgba(0,212,255,0.3)"/>
        <rect x="20" y="58" width="140" height="40" rx="4" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
        <!-- Code lines -->
        <rect x="28" y="68" width="40" height="3" rx="1.5" fill="url(#grn)"/>
        <rect x="72" y="68" width="20" height="3" rx="1.5" fill="rgba(0,230,118,0.5)"/>
        <rect x="28" y="78" width="60" height="3" rx="1.5" fill="rgba(0,212,255,0.5)"/>
        <rect x="92" y="78" width="20" height="3" rx="1.5" fill="rgba(0,230,118,0.5)"/>
        <rect x="28" y="88" width="30" height="3" rx="1.5" fill="rgba(0,212,255,0.5)"/>
    </g>

    <!-- Floating chip icon (top right) -->
    <g transform="translate(280 80)" opacity="0.9">
        <rect x="0" y="0" width="60" height="60" rx="14" fill="rgba(0,212,255,0.1)" stroke="url(#acc)" stroke-width="2"/>
        <rect x="18" y="18" width="24" height="24" rx="3" fill="none" stroke="url(#acc)" stroke-width="2"/>
        <path d="M9 22h6M9 30h6M9 38h6M45 22h6M45 30h6M45 38h6M22 9v6M30 9v6M38 9v6M22 45v6M30 45v6M38 45v6" stroke="url(#acc)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Floating code brackets (left) -->
    <g transform="translate(60 230)" opacity="0.85">
        <rect x="0" y="0" width="60" height="60" rx="14" fill="rgba(79,70,229,0.1)" stroke="url(#acc)" stroke-width="2"/>
        <path d="M22 18 L14 30 L22 42 M38 18 L46 30 L38 42" fill="none" stroke="url(#acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Floating bulb (bottom right) -->
    <g transform="translate(285 240)" opacity="0.9">
        <rect x="0" y="0" width="56" height="56" rx="14" fill="rgba(0,230,118,0.1)" stroke="url(#grn)" stroke-width="2"/>
        <path d="M22 16c-5 0-9 4-9 9 0 3 1.5 5 3 7l1 1.5h10l1-1.5c1.5-2 3-4 3-7 0-5-4-9-9-9z" fill="none" stroke="url(#grn)" stroke-width="2" stroke-linejoin="round"/>
        <path d="M22 38v3M19 44h6" stroke="url(#grn)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Connecting dotted lines -->
    <g stroke="rgba(0,212,255,0.3)" stroke-width="1.2" stroke-dasharray="2 4" fill="none">
        <path d="M170 130 L260 100"/>
        <path d="M120 240 L120 200"/>
        <path d="M260 260 L290 240"/>
    </g>

    <!-- Sparkles -->
    <g fill="#00D4FF">
        <circle cx="80" cy="120" r="2.5" opacity="0.7"/>
        <circle cx="340" cy="160" r="2" opacity="0.6"/>
        <circle cx="320" cy="320" r="2.5" opacity="0.7"/>
        <circle cx="70" cy="320" r="2" opacity="0.5"/>
    </g>
    <g fill="#00E676">
        <circle cx="60" cy="180" r="1.8" opacity="0.6"/>
        <circle cx="350" cy="240" r="1.8" opacity="0.6"/>
    </g>
</svg>
