<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B1020">
    <title>Offline — Ghanashyam Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .offline-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem; background: var(--bg-primary); }
        .offline-card { max-width: 460px; width: 100%; text-align: center; padding: 2.5rem 2rem; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: var(--shadow); }
        .offline-card img { height: 56px; width: auto; margin: 0 auto 1.25rem; display: block; }
        .offline-icon { width: 72px; height: 72px; margin: 0 auto 1rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(0, 212, 255, 0.12); color: var(--accent); font-size: 1.8rem; }
        .offline-card h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .offline-card p { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1.75rem; }
        .offline-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
        .offline-actions .btn { flex: 1; min-width: 140px; }
    </style>
</head>
<body>
    <div class="offline-wrap">
        <div class="offline-card">
            <img src="assets/logo.svg" alt="GP — Ghanashyam Pabbuleti">
            <div class="offline-icon"><i class="fas fa-wifi"></i></div>
            <h1>You're Offline</h1>
            <p>It looks like you've lost your internet connection. The page you tried to open isn't available right now.</p>
            <div class="offline-actions">
                <button class="btn btn-primary" onclick="window.location.reload()">
                    <i class="fas fa-rotate-right"></i> Retry
                </button>
                <a href="../../" class="btn btn-outline">
                    <i class="fas fa-house"></i> Return to Hub
                </a>
            </div>
        </div>
    </div>
    <script>
        try {
            const saved = localStorage.getItem('theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {}
    </script>
</body>
</html>
