<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B1020">
    <meta name="description" content="You're offline — Student Hub">
    <title>Offline — Student Hub</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/hub.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1.5rem; }
        .offline-card { max-width: 480px; width: 100%; text-align: center; padding: 2.5rem 2rem; }
        .offline-icon {
            width: 88px; height: 88px;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            display: grid; place-items: center;
            background: var(--primary-soft);
            color: var(--primary);
        }
        .offline-icon svg { width: 40px; height: 40px; }
        .offline-card h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; }
        .offline-card p { color: var(--text-soft); margin-bottom: 1.75rem; }
        .offline-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
        .offline-actions .btn { flex: 1; min-width: 140px; }
    </style>
</head>
<body>
    <div class="glass offline-card">
        <div class="offline-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
        </div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. The page you tried to open isn't available right now.</p>
        <div class="offline-actions">
            <button class="btn btn-primary" onclick="window.location.reload()">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
                Retry
            </button>
            <a href="./" class="btn btn-outline">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                Return Home
            </a>
        </div>
    </div>
</body>
</html>
