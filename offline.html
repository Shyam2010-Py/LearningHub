<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#62b0ff">
<meta name="description" content="You are offline — LearningHub">
<title>Offline — LearningHub</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/hub.css">
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem 1.5rem;
    }
    .offline-card {
        max-width: 460px;
        width: 100%;
        text-align: center;
        padding: 2.4rem 2rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
    }
    .offline-icon {
        width: 84px;
        height: 84px;
        margin: 0 auto 1.2rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(98, 176, 255, 0.1);
        border: 1px solid rgba(98, 176, 255, 0.25);
        color: var(--accent);
    }
    .offline-icon svg { width: 38px; height: 38px; }
    .offline-card h1 {
        font-size: 1.55rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
    }
    .offline-card p {
        color: var(--muted);
        margin: 0 0 1.6rem;
        font-size: 0.95rem;
    }
    .offline-actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        justify-content: center;
    }
    .offline-actions .btn { flex: 1; min-width: 140px; }
</style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
        </div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. The page you tried to open isn't available right now.</p>
        <div class="offline-actions">
            <button class="btn btn-primary" onclick="window.location.reload()">Retry</button>
            <a href="./" class="btn">Return Home</a>
        </div>
    </div>
</body>
</html>
